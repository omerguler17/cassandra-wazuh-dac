name: XML Validation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-xml:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Python kullanarak XML yapısını %100 kusursuz kontrol eden alternatif yöntem
    - name: Verify XML Syntax with Python
      run: |
        python3 -c "
        import xml.etree.ElementTree as ET
        import sys
        try:
            ET.parse('custom_rules/sshd_rules.xml')
            print('XML yapısı geçerli ve hatasız!')
        except Exception as e:
            print(f'Hata buldu: {e}')
            sys.exit(1)
        "